; Copy to /etc/supervisor/conf.d/email-marketing.conf, then:
;   supervisorctl reread && supervisorctl update
; Adjust /var/www/email-marketing and the user to match your server.

[program:ems-emails]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/email-marketing/artisan queue:work redis --queue=emails --sleep=2 --tries=3 --timeout=300 --max-time=3600 --max-jobs=500
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/email-marketing/storage/logs/worker-emails.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=330

[program:ems-imports]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/email-marketing/artisan queue:work redis --queue=imports,default --sleep=3 --tries=3 --timeout=300 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/email-marketing/storage/logs/worker-imports.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=330
