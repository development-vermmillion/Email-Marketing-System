<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<title>Hello {{name}}</title>
<style>
  body { margin:0; padding:0; background:#f4f5f9; }
  img { border:0; max-width:100%; }
  a { color:#5b4cf5; }
  @media only screen and (max-width:620px) {
    .container { width:100% !important; }
    .px { padding-left:20px !important; padding-right:20px !important; }
    .btn a { display:block !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background:#f4f5f9;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f9;">
  <tr><td align="center" style="padding:24px 12px;">
    <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:600px;background:#ffffff;border-radius:12px;">
      <tr><td class="px" style="padding:32px 40px 8px;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#5b4cf5;font-weight:bold;">{{company}}</td></tr>
      <tr><td class="px" style="padding:8px 40px;font-family:Arial,Helvetica,sans-serif;font-size:26px;line-height:34px;color:#16171d;font-weight:bold;">Hi {{first_name}}, here is what's new</td></tr>
      <tr><td class="px" style="padding:8px 40px 24px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;color:#454857;">
        Thanks for being part of our community. Replace this paragraph with your announcement, offer or newsletter content.
      </td></tr>
      <tr><td class="px btn" style="padding:0 40px 32px;">
        <table role="presentation" cellpadding="0" cellspacing="0"><tr>
          <td style="background:#5b4cf5;border-radius:8px;">
            <a href="https://example.com" style="display:inline-block;padding:14px 28px;font-family:Arial,Helvetica,sans-serif;font-size:16px;color:#ffffff;text-decoration:none;font-weight:bold;">Read more</a>
          </td>
        </tr></table>
      </td></tr>
      <tr><td class="px" style="padding:24px 40px 32px;border-top:1px solid #ececf3;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#8b8fa3;">
        You are receiving this email at {{email}} because you subscribed to our updates.<br>
        {{sender_address}}<br>
        <a href="{{unsubscribe_url}}" style="color:#8b8fa3;">Unsubscribe</a>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
